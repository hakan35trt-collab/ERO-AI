name: ERO Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ero-android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıklar
        run: npm ci

      - name: Test
        run: npm test

      - name: Web arayüz
        env:
          ERO_BASE: ./
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$VITE_GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is available to the build."
          else
            echo "GEMINI_API_KEY secret is empty. ERO bu derlemede cevap üretemez."
          fi
          npm run build
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -a dist/. android/app/src/main/assets/www/

      - name: İmza
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ERO_SIGNING_PASSPHRASE: ${{ secrets.ERO_SIGNING_PASSPHRASE }}
          ERO_KEYSTORE_BASE64: ${{ secrets.ERO_KEYSTORE_BASE64 }}
          ERO_KEYSTORE_PASSWORD: ${{ secrets.ERO_KEYSTORE_PASSWORD }}
          ERO_KEY_ALIAS: ${{ secrets.ERO_KEY_ALIAS }}
          ERO_KEY_PASSWORD: ${{ secrets.ERO_KEY_PASSWORD }}
        run: |
          bash scripts/release-signing.sh self-test
          bash scripts/release-signing.sh

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK
        working-directory: android
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is available to the build."
          else
            echo "GEMINI_API_KEY secret is empty. ERO bu derlemede cevap üretemez."
          fi
          if [ -n "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY secret is available."
          else
            echo "YOUTUBE_API_KEY secret is empty. YouTube opens search instead of the first video."
          fi
          VERSION="1.0.${{ github.run_number }}"
          gradle :app:assembleRelease -PversionCode=${{ github.run_number }} -PversionName="$VERSION" --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ERO.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Yayın
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(printf 'version: %s\n\nERO telefon uygulaması. ERO.apk dosyasını indirip kur.\nSertifika SHA-256: %s\n' "$VERSION" "$ERO_CERT_SHA256")
          gh release create "v$VERSION" ERO.apk --title "ERO $VERSION" --notes "$NOTES" --latest
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ERO.apk --title "ERO latest" --notes "$NOTES" --prerelease
